name: greeninvest
description: GreenInvest - Renewable Energy Investment Platform
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # Navigation
  go_router: ^12.0.0
  # State management
  flutter_riverpod: ^2.4.0
  # HTTP
  dio: ^5.4.0
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  fl_chart: ^0.65.0
  # Forms
  reactive_forms: ^16.1.0
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.0
  image_picker: ^1.0.0
  permission_handler: ^11.1.0
  local_auth: ^2.1.0
  flutter_otp_text_field: ^1.0.3
  # Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
