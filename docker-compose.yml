version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: greeninvest-postgres
    environment:
      POSTGRES_DB: greeninvest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - greeninvest-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: greeninvest-redis
    ports:
      - '6379:6379'
    networks:
      - greeninvest-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greeninvest-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: greeninvest
      JWT_SECRET: greeninvest-super-secret-change-in-prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:5173
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - greeninvest-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: greeninvest-frontend
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - '5173:5173'
    networks:
      - greeninvest-network
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  greeninvest-network:
    driver: bridge
